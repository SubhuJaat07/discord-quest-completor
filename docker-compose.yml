services:
  discord-quest-completor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-quest-completor
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      # Persistent storage for the 24h monitor (encrypted token + schedule + history).
      # Mount this volume so redeploys don't lose the monitor!
      - DATA_DIR=/app/data
      # Engine tuning (defaults are safe — see docs)
      - QUEST_HEARTBEAT_INTERVAL_MS=90000
      - QUEST_VIDEO_TICK_MS=1100
      # DISCORD_API_BASE=https://discord.com/api/v10
    env_file:
      - path: .env
        required: false
    volumes:
      # data survives redeploys (Coolify: point this at any volume/host path)
      - quest-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3000}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  quest-data:
